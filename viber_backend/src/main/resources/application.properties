# ─────────────────────────────────────────────────────────────────────────────
# Configuración base de Viber.
#
# NO pongas secretos en este archivo: está versionado en git. Los valores
# sensibles se leen de variables de entorno (`${VAR:defecto}`) y, en desarrollo
# local, de `application-local.properties`, que está en .gitignore y sobreescribe
# lo de aquí. Copia `application-local.properties.example` para arrancar.
# ─────────────────────────────────────────────────────────────────────────────

# Perfil por defecto: carga application-local.properties si existe.
# En producción se sobreescribe con la env var SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=local

# API Key de Google Cloud Console (búsqueda de YouTube)
youtube.api.key=${YOUTUBE_API_KEY:}

# 1. Configuración de la Base de Datos (MySQL)
# characterEncoding=UTF-8 + connectionCollation fuerzan utf8mb4 en la conexión:
# sin esto el driver autodetecta el charset del servidor y, si está en latin1,
# los emojis (pares surrogate) se guardan como "??". Imprescindible para el modo emoji.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/viber_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Forzamos el dialecto de MySQL 8 ya que Hibernate no puede autodetectarlo
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Muy importante: añade esto para evitar que Hibernate intente consultar metadatos que fallan
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# 2. Configuración de Hibernate / JPA
# 'update' crea las tablas si no existen o las actualiza sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Configuración del Servidor
server.port=${SERVER_PORT:8080}


# OAuth de Google. El client-id no es secreto (viaja en el cliente web y móvil),
# pero se deja configurable para poder apuntar a otro proyecto de Google Cloud.
google.client-id=${GOOGLE_CLIENT_ID:}

# JWT — clave de firma. Debe ser larga y aleatoria; genera una nueva por entorno:
#   openssl rand -base64 48
jwt.secret=${JWT_SECRET:}

# Credenciales de Firebase Admin (Firestore + push). Ruta al JSON de la service
# account: `classpath:` para un archivo en resources, `file:` para una ruta
# absoluta en el servidor.
firebase.credentials=${FIREBASE_CREDENTIALS:classpath:serviceAccountKey.json}

# Logging de stats (DEBUG muestra flujo de reproducciones; quitar en producción)
logging.level.com.example.viber.service.UserStatsService=DEBUG

# API de Groq - generacion automatica de emojis del quiz (gratis, sin tarjeta).
# Crea una key en https://console.groq.com/keys. Si queda vacia, el boton
# 'Emojis (IA)' del panel admin lo indicara y todo lo demas funciona igual.
groq.api.key=${GROQ_API_KEY:}
# Modelo gratis del tier de Groq (llama-3.3-70b-versatile = buena calidad)
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# ── Recomendación de salas y auto-DJ ────────────────────────────────────────
# Vida media (días) del decaimiento por recencia del gusto: más bajo = manda lo
# de hace poco (el rock reciente gana al hip-hop de hace un año); más alto = pesa
# más el histórico.
reco.half-life-days=14
# Solo se miran eventos de escucha más recientes que esta ventana (días).
reco.window-days=120

# Auto-DJ de salas permanentes
autodj.min-queue=2
autodj.scan-interval-ms=20000
autodj.same-artist-probability=0.5

# Last.fm — mejora OPCIONAL del grafo de artistas similares (auto-DJ/recomendación).
# Gratis: crea una key en https://www.last.fm/api/account/create. Vacía = solo
# Deezer (sin key) como fuente de similares; Groq queda de último recurso.
lastfm.api.key=${LASTFM_API_KEY:}

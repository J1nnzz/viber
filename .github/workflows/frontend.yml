name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'viber_frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'viber_frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viber_frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Sin paso de `dart format --set-exit-if-changed`: el código actual no
      # sigue el formateador (116 de 129 archivos cambiarían). Activarlo exige
      # antes un pase de formato en todo el proyecto.
      #
      # --no-fatal-infos: errores y warnings sí tumban el build (ahora mismo hay
      # cero), pero quedan ~125 avisos de nivel info (deprecaciones de Flutter y
      # lints de estilo) que no deben bloquear un merge.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: viber_frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Solo se compila web: la build de Android necesita un
      # google-services.json real, que no está en el repo a propósito.
      - name: Build web
        run: flutter build web --release
